name: Build & Release Android APK

on:
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '.gitignore'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.4'
          cache: true

      - name: Install Flutter Dependencies
        run: flutter pub get

      - name: Build Android Release APK
        run: flutter build apk --release --no-tree-shake-icons

      - name: Prepare Release Artifact
        run: |
          mkdir -p release_output
          cp build/app/outputs/flutter-apk/app-release.apk release_output/personal_hub.apk
          cp version.json release_output/version.json

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Personal Hub Latest Release"
          body: "Direct OTA Release. Pushed from commit ${{ github.sha }}."
          draft: false
          prerelease: false
          files: |
            release_output/personal_hub.apk
            release_output/version.json
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

