name: personal_hub
description: "Personal All-In-One Offline Application - Stage 1 Foundation"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  # Navigation & Routing
  go_router: ^14.8.1

  # State Management
  flutter_riverpod: ^2.6.1

  # Local Relational Database (SQLite / Drift)
  drift: ^2.24.2
  drift_flutter: ^0.2.4
  sqlite3_flutter_libs: ^0.5.28
  path_provider: ^2.1.5
  path: ^1.9.1

  # Secure Storage & Cryptography
  flutter_secure_storage: ^9.2.4
  crypto: ^3.0.6

  # Notifications Foundation
  flutter_local_notifications: ^18.0.1
  timezone: ^0.10.0

  # Utilities
  intl: any
  uuid: ^4.5.1
  file_picker: ^8.1.7
  share_plus: ^10.1.4
  fl_chart: ^1.2.0
  flutter_quill: ^10.7.3
  flutter_staggered_grid_view: ^0.7.0
  app_usage: ^4.1.0
  device_apps: ^2.2.0
  app_settings: ^9.0.0
  just_audio: ^0.10.6
  just_audio_background: ^0.0.1-beta.17
  audio_service: ^0.18.19
  on_audio_query: ^2.9.0
  shared_storage: ^0.8.1
  home_widget: ^0.9.2+1
  perfect_freehand: ^2.5.2+1
  pdf: ^3.12.0
  printing: ^5.14.3
  flutter_colorpicker: ^1.1.0


  shared_preferences: any
dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code Generation for Drift
  drift_dev: ^2.24.2
  build_runner: ^2.4.15

  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

dependency_overrides:
  intl: ^0.20.2
