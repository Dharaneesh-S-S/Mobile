[build]
  publish = "build/web"
  command = "if [ ! -f \"_flutter/bin/flutter\" ]; then rm -rf _flutter && git clone https://github.com/flutter/flutter.git --depth 1 -b 3.35.4 _flutter; fi && export PATH=\"$PATH:$(pwd)/_flutter/bin\" && flutter build web --release --no-tree-shake-icons"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "credentialless"
